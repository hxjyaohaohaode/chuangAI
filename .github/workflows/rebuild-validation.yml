name: Runtime refactor verification
on:
  push:
    branches: [refactor/verified-foundation-20260926]
permissions:
  contents: write
concurrency:
  group: verified-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Prepare runtime
        run: |
          mkdir -p "$RUNNER_TEMP/poetic-evidence"
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          node --version
          pnpm --version
      - name: Integrate inspected runtime sources
        run: python3 scripts/apply-runtime-refactor.py
      - name: Execute all regression gates
        run: python3 scripts/verify-runtime-refactor.py
      - name: Publish tested source integration to the same branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- backend/src/orchestrator/Orchestrator.ts backend/src/orchestrator/plan-validation.ts backend/src/orchestrator/session-store.ts backend/package.json frontend/package.json .node-version .nvmrc docs/runtime-verification.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor: integrate runtime kernel after executed full-stack regression'
          HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$HEADER" push origin HEAD:refs/heads/refactor/verified-foundation-20260926
          echo "PUBLISHED_COMMIT=$(git rev-parse HEAD)"
      - name: Preserve raw verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/poetic-evidence/
          retention-days: 14
          if-no-files-found: error
